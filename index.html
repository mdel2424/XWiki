<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https://upload.wikimedia.org https://*.wikimedia.org data:; connect-src 'self' https://hn.algolia.com https://*.wikipedia.org; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <title>XWiki</title>
  <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <a class="skip-link" href="#timeline">Skip to feed</a>
  <div id="app"></div>
  <div id="pull-refresh" class="pull-refresh" data-state="idle" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="sheet" aria-labelledby="sheet-title"></dialog>
</body>
</html>
